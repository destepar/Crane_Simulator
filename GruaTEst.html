<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Visor de Grúa Liebherr</title>
    <style>
        body {
            margin: 0;
            background: #111;
            overflow: hidden;
        }

        #info {
            position: absolute;
            top: 10px;
            width: 100%;
            text-align: center;
            color: white;
            font-family: sans-serif;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <div id="info">Cargando modelo: LTM 1110 LIEBHERR...</div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <script>
        const scene = new THREE.Scene();
        window.scene = scene;
        scene.background = new THREE.Color(0x222222);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(20, 20, 20);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);

        // --- EL SECRETO PARA LOS COLORES GLTF ---
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.toneMapping = THREE.ACESFilmicToneMapping; // Le da un toque cinematográfico realista
        renderer.toneMappingExposure = 1.2; // Brillo general
        document.body.appendChild(renderer.domElement);

        // --- LUCES ENVOLVENTES ---
        // Luz Hemisférica (Simula la luz del cielo azul arriba y el rebote del suelo gris abajo)
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.5);
        hemiLight.position.set(0, 20, 0);
        scene.add(hemiLight);

        // Luz Direccional (Simula un Sol potente)
        const dirLight = new THREE.DirectionalLight(0xffffff, 2.0);
        dirLight.position.set(20, 30, 20);
        scene.add(dirLight);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);

        // CARGADOR GLTF
        const loader = new THREE.GLTFLoader();
        loader.load('Assets3D/LTM 1110 LIEBHERR.gltf', function (gltf) {
            const model = gltf.scene;
            scene.add(model);
            document.getElementById('info').innerText = "Modelo cargado con éxito";

            // Centrar cámara automáticamente al modelo
            const box = new THREE.Box3().setFromObject(model);
            const center = box.getCenter(new THREE.Vector3());
            controls.target.copy(center);
            controls.update();

            // TIP: Imprimir en consola para ver los nombres que pusiste en FreeCAD
            console.log("Estructura del modelo:", model);
            model.traverse((node) => {
                if (node.isMesh || node.isGroup) console.log("Pieza encontrada:", node.name);
            });

        }, undefined, function (error) {
            console.error(error);
            document.getElementById('info').innerText = "Error al cargar el archivo. Revisa la consola.";
        });

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>

</html>
